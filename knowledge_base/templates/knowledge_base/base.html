<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Health Questions{% endblock %}</title>
  <style>
    :root { --text: #1a1a1a; --muted: #4a4a4a; --bg: #ffffff; --panel: #f4f6f8; --accent: #0b5cad; --border: #c9d1d9; --warn-bg: #fff4e5; --warn: #7a4100; --error-bg: #fdecea; --error: #8a1c12; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 1.25rem/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 46rem; margin: 0 auto; padding: 1.5rem 1rem 4rem; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; border-bottom: 1px solid var(--border); padding-bottom: 1rem; margin-bottom: 1.5rem; }
    h1 { font-size: 1.75rem; margin: 0; }
    h2 { font-size: 1.4rem; margin: 2rem 0 0.75rem; }
    label { display: block; font-weight: 600; margin-bottom: 0.5rem; }
    textarea, select, input[type=text], input[type=password] { width: 100%; font: inherit; padding: 0.75rem; border: 2px solid var(--border); border-radius: 8px; }
    textarea:focus, input:focus, button:focus, a:focus, summary:focus { outline: 3px solid var(--accent); outline-offset: 2px; }
    button { font: inherit; font-weight: 600; padding: 0.7rem 1.6rem; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; margin-top: 0.75rem; }
    .link-button { background: none; color: var(--accent); padding: 0; margin: 0; text-decoration: underline; font-weight: 400; }
    a { color: var(--accent); }
    .notice { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 0.75rem 1rem; }
    .error { background: var(--error-bg); color: var(--error); border-radius: 8px; padding: 0.75rem 1rem; }
    .answer { background: var(--panel); border-radius: 8px; padding: 1rem 1.25rem; }
    .sources { padding-left: 0; list-style: none; }
    .sources li { border: 1px solid var(--border); border-radius: 8px; padding: 0.75rem 1rem; margin-bottom: 0.75rem; }
    .meta { color: var(--muted); font-size: 1.1rem; }
    blockquote { margin: 0.5rem 0 0; padding-left: 1rem; border-left: 4px solid var(--border); color: var(--muted); white-space: pre-line; }
  </style>
</head>
<body>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
