{% extends "knowledge_base/base.html" %}

{% block title %}Sign in · Health Questions{% endblock %}

{% block content %}
<header><h1>Sign in</h1></header>

{% if form.errors %}
  <p class="error" role="alert">Your username and password didn't match. Please try again.</p>
{% endif %}

<form method="post" action="{% url 'login' %}">
  {% csrf_token %}
  <p>
    <label for="{{ form.username.id_for_label }}">Username</label>
    <input type="text" name="{{ form.username.html_name }}" id="{{ form.username.id_for_label }}" value="{{ form.username.value|default:'' }}" autocomplete="username" required autofocus>
  </p>
  <p>
    <label for="{{ form.password.id_for_label }}">Password</label>
    <input type="password" name="{{ form.password.html_name }}" id="{{ form.password.id_for_label }}" autocomplete="current-password" required>
  </p>
  <input type="hidden" name="next" value="{{ next }}">
  <button type="submit">Sign in</button>
</form>
{% endblock %}
